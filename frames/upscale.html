<!DOCTYPE html>
<html lang="en">
<head>

<title>upscale runner</title>
</head>

<script src="../vendor/tfjs/tf.min.js"></script>
<script src="../vendor/upscaler/upscaler.min.js"></script>

</body>
</html>
